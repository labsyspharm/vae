{% set name = "vae" %}
{% set version = "0.0.8" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  git_url: https://github.com/labsyspharm/vae.git
  git_tag: v0.0.8
  # git_rev: main

build:
  number: 0
  noarch: python
  script:
    - "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "
    # - "{{ PYTHON }} -m pip install git+https://github.com/catalystneuro/lazy_ops.git@main -vv "
    # - "{{ PYTHON }} -m pip install git+https://github.com/labsyspharm/cellcutter.git@main -vv "
  entry_points:
    - vae=vae.scripts.__main__:main

requirements:
  host:
    - pip
    - python >=3.11,<3.12
    - poetry-core >=1.0.0
  
  # build:
  #   - python
  #   - pip
  #   - setuptools
  #   - wheel

  run:
    - python >=3.11,<3.12
    # - cellcutter =0.2.7
    - zarr >=3
    - cellcutter >=0.2.13  # this version is compatible with Zarr3
    - keras
    - natsort
    - pandas
    - pyarrow
    - pyyaml
    - scikit-image
    - seaborn
    - scikit-learn <1.3
    - umap-learn <0.5.4
    - tifffile =2024.12.12
    - tensorflow =2.15.0  # avoiding "from tensorflow.keras import XX" errors with tf >= 2.16 and making compatible with available o2 GPU CUDA modules.
    - tensorflow-probability =0.23.0  # compatible with TF 2.15.0
    
    # - zarr <=2.14.0  # requirement of cellcutter
    # - numcodecs <0.13
    - opencv
    - napari
    - dask
    - ome-types
    - pytorch # used for Pytorch segmentation models 
    - pytorch-lightning
    - segmentation-models-pytorch
    - scanpy
    - igraph
    - leidenalg

test:
  imports:
    - vae

about:
  home: https://github.com/labsyspharm/vae
  license: MIT
  license_family: BSD
  summary: Generate cropped image patches from a multi-channel TIF image, train a VAE model, and perform clustering on latent space image patch encodings.
  description-file: README.md
