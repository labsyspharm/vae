{% set name = "vae" %}
{% set version = "0.0.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  git_url: https://github.com/labsyspharm/vae.git
  git_tag: main
build:
  number: 0
  script:
    - "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "
    - "{{ PYTHON }} -m pip install git+https://github.com/catalystneuro/lazy_ops.git@master -vv "
  entry_points:
    - vae=vae.scripts.__main__:main
  noarch: python

requirements:
  build:
    - poetry
  host:
    - pip
    - python
    - poetry
  run:
    - python
    - zarr<=2.14.2  # change in API related to zarr.LRUStoreCache() in versions > 2.14.2 called on line 87 in cellcutter/utils.py (returns blank images)
    - hdbscan
    - umap-learn
    - keras
    - natsort
    - pandas
    - pyarrow
    - pyyaml
    - seaborn
    - tensorflow  # currently requires python <3.11 to be installed via conda
    - cellcutter

test:
  imports:
    - vae

about:
  home: https://github.com/labsyspharm/vae
  license: MIT
  license_family: BSD
  summary: "Generate thumbnail images of cells from a multi-channel TIFF image, train a VAE model, and perform clustering on latent space vectors."
  description-file: README.md

extra:
  recipe-maintainers:
    - Gregory J. Baker <gregory_baker2@hms.harvard.edu>
