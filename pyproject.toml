[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vae"
version = "0.0.8"
description = "Generate cropped image patches from a multi-channel TIF image, train a VAE model, and perform clustering on latent space image patch encodings."
readme = "README.md"
license = "MIT"
keywords =['spatial proteomics, variational autoencoder (VAE), artificial intelligence, tissue phenotyping']
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: End Users/Desktop',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Visualization'
]
authors = ["Gregory J. Baker <gregory_baker2@hms.harvard.edu>"]
homepage = "https://github.com/labsyspharm/vae"

[tool.poetry.dependencies]
python = "3.11"
hdbscan = "*"
umap-learn = "<0.5.4"
keras = "*"
natsort = "*"
pandas = "*"
pyarrow = "*"
pyyaml = "*"
seaborn = "*"
tifffile = "2024.12.12"
scikit-learn = "<1.3"
scikit-image = "*"
tensorflow = "2.15.0" # avoiding "from tensorflow.keras import XX" errors with tf >= 2.16 and making compatible with available o2 GPU CUDA modules.
tensorflow-probability = "0.23.0" # compatible with TF 2.15.0
zarr = "<3.0.0"
opencv = "*"
napari = "*"
dask = "*"
ome-types = "*"
torch = "*"
pytorch-lightning = "*"
segmentation-models-pytorch = "*"

